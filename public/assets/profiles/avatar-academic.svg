<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121028"/>
      <stop offset="50%" stop-color="#181438"/>
      <stop offset="100%" stop-color="#0a0818"/>
    </linearGradient>
    <radialGradient id="aura" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#7c5dfa" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#7c5dfa" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glow" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#4378ff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#7c5dfa" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="400" height="500" fill="url(#bgGrad)"/>
  <circle cx="200" cy="200" r="140" fill="url(#aura)"/>

  <!-- Geometric Academic Motif -->
  <g opacity="0.25" stroke="#7c5dfa" stroke-width="1.5" fill="none">
    <circle cx="200" cy="200" r="110"/>
    <circle cx="200" cy="200" r="80" stroke-dasharray="4 6"/>
    <polygon points="200,100 286,250 114,250"/>
  </g>

  <!-- Stylized Figure Silhouette -->
  <g transform="translate(200, 230)">
    <!-- Shoulders -->
    <path d="M-110,190 C-100,110 -60,85 -25,75 L-25,45 C-25,45 -35,35 -35,15 C-35,-15 -25,-45 0,-45 C25,-45 35,-15 35,15 C35,35 25,45 25,45 L25,75 C60,85 100,110 110,190 Z" fill="#201b44"/>
    
    <!-- Inner suit & collar -->
    <path d="M-25,75 L0,125 L25,75 L15,190 L-15,190 Z" fill="#14112e"/>
    <polygon points="0,95 -12,125 0,155 12,125" fill="#7c5dfa"/>

    <!-- Head & Hair Silhouette -->
    <ellipse cx="0" cy="0" rx="36" ry="44" fill="#2d265c"/>
    <path d="M-36,-10 C-35,-40 -20,-55 5,-52 C28,-50 38,-35 36,-10 C30,-30 10,-42 -10,-38 C-25,-35 -34,-25 -36,-10 Z" fill="#443b82"/>

    <!-- Stylized Glasses -->
    <rect x="-28" y="-8" width="22" height="15" rx="3" fill="none" stroke="#60a5fa" stroke-width="2.5"/>
    <rect x="6" y="-8" width="22" height="15" rx="3" fill="none" stroke="#60a5fa" stroke-width="2.5"/>
    <line x1="-6" y1="-1" x2="6" y2="-1" stroke="#60a5fa" stroke-width="2"/>
  </g>

  <!-- Atmospheric Glow from Below -->
  <rect y="320" width="400" height="180" fill="url(#glow)"/>
</svg>
