<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <defs>
    <linearGradient id="bgGradProd" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180e28"/>
      <stop offset="50%" stop-color="#24143a"/>
      <stop offset="100%" stop-color="#0c0716"/>
    </linearGradient>
    <radialGradient id="auraProd" cx="50%" cy="38%" r="52%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glowProd" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="400" height="500" fill="url(#bgGradProd)"/>
  <circle cx="200" cy="190" r="140" fill="url(#auraProd)"/>

  <!-- UI Wireframe Shapes -->
  <g opacity="0.3" stroke="#c084fc" stroke-width="1.2" fill="none">
    <rect x="70" y="90" width="80" height="60" rx="8"/>
    <rect x="250" y="80" width="90" height="70" rx="8"/>
    <line x1="85" y1="110" x2="135" y2="110"/>
    <line x1="85" y1="125" x2="115" y2="125"/>
    <circle cx="280" cy="105" r="8"/>
    <line x1="270" y1="125" x2="320" y2="125"/>
  </g>

  <!-- Stylized Figure Silhouette -->
  <g transform="translate(200, 230)">
    <!-- Shoulders -->
    <path d="M-110,190 C-100,115 -60,85 -25,75 L-25,45 C-25,45 -35,35 -35,15 C-35,-15 -25,-45 0,-45 C25,-45 35,-15 35,15 C35,35 25,45 25,45 L25,75 C60,85 100,115 110,190 Z" fill="#2d1c44"/>
    
    <!-- Inner collar -->
    <path d="M-20,75 L0,115 L20,75 L10,190 L-10,190 Z" fill="#1b112a"/>

    <!-- Head & Flowing Hair Silhouette -->
    <ellipse cx="0" cy="0" rx="34" ry="42" fill="#3c265c"/>
    <path d="M-36,-15 C-38,-45 -15,-60 12,-55 C35,-50 42,-30 40,-5 C45,15 48,50 35,80 C32,60 25,45 25,35 C25,15 28,-15 15,-30 C5,-40 -15,-35 -25,-25 C-32,-18 -34,-5 -36,-15 Z" fill="#583884"/>
  </g>

  <rect y="320" width="400" height="180" fill="url(#glowProd)"/>
</svg>
